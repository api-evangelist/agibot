- aid: agibot:store-commerce
  name: AGIBOT Store Agent Commerce API (UCP / MCP)
  description: 'The AGIBOT online store implements the Universal Commerce Protocol
    (UCP) for agent-driven commerce and exposes a live, anonymous, hosted Model Context
    Protocol endpoint. A JSON-RPC 2.0 tools/list call returns 13 real tools with full
    JSON Schema inputs: search_catalog, lookup_catalog and get_product for discovery;
    create_cart, get_cart, update_cart and cancel_cart for cart state; create_checkout,
    get_checkout, update_checkout, complete_checkout and cancel_checkout for purchase;
    and get_order for order status. A UCP merchant profile at /.well-known/ucp declares
    the supported protocol versions, the shopping service endpoints, the checkout,
    cart, fulfillment, discount, order and catalog capabilities, and the Google Pay
    and Shopify card payment handlers. Customer-scoped calls authenticate through an
    OAuth 2.0 / OpenID Connect authorization server with PKCE. The store publishes
    both /llms.txt and /agents.md describing the agent contract, and requires contemporaneous
    human approval before any payment is completed.'
  humanURL: https://store.agibot.com/
  baseURL: https://store.agibot.com/api/ucp/mcp

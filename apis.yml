aid: agibot
name: AgiBot
description: 'AgiBot (AGIBOT Innovation (Shanghai) Technology Co., Ltd., known in Chinese
  as Zhiyuan Robotics / 智元机器人) is a Shanghai-based embodied-intelligence company founded
  in 2023 that designs and mass-produces humanoid and wheeled service robots — the
  Expedition A2/A3 full-size humanoids, the X1/X2 open-source bipeds, the Genie G1/G2
  and D1 series, the C5, and the OmniHand dexterous hands. Its developer surface is
  not a public web API but a robotics contract stack: AimRT, an in-house C++20 runtime
  and middleware compatible with ROS 2, gRPC, HTTP, MQTT, Zenoh and Iceoryx; Link-U
  OS, an open-source embodied operating system; and the AimDK protocol, a first-party
  Protocol Buffers definition of the robot itself — hardware abstraction (hands, arms,
  audio, lights, neck, battery management, cameras, temperature, emergency stop), motion
  control, kinematics, force control, teleoperation and a health-and-diagnostics service.
  AgiBot also publishes the AgiBot World dataset, the Genie Sim simulation platform,
  and runs an online store that implements the Universal Commerce Protocol with a live
  hosted MCP endpoint for agent-driven purchasing.'

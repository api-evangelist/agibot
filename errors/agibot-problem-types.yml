notes: 'AgiBot does not publish an HTTP problem-details catalogue — it has no public web API. Error semantics
  are defined in the AimDK protobuf contract: every RPC returns a ResponseHeader with a numeric code (0
  = success, non-zero = failure) and a human-readable msg, and long-running calls additionally carry a
  CommonState. Runtime faults are reported out-of-band through the health-and-diagnostics (hds) surface
  as module exceptions and alerts. The specific non-zero code values are module-defined and are not enumerated
  in the published protos, so no code list is asserted here.'

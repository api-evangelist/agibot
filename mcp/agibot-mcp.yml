notes: AgiBot publishes a live, anonymous, hosted MCP endpoint on its online store as part of its Universal
  Commerce Protocol (UCP) implementation. A JSON-RPC 2.0 tools/list POST returned 200 with 13 tools and
  full JSON Schema inputSchemas, saved verbatim to mcp/agibot-mcp-tools.json. The store is built on Shopify,
  so the UCP/MCP surface is platform-provided but served from AgiBot’s own host under AgiBot’s merchant
  identity (merchant_name AGIBOT, merchant_origin store.agibot.com). No MCP server exists for the AimDK
  robot protocol.

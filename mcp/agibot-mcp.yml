guardrails:
- Checkout requires contemporaneous human approval — agents must not complete payment without explicit
  buyer consent.
- The MCP endpoint is rate limited per IP; agents must back off on 429.
- Agents should pass context.address_country and context.currency for accurate pricing and availability.
